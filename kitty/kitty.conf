#font_family JetBrains Mono NF
#font_size 14
# ========================
# FONT
# ========================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        13.0

# ========================
# CURSOR
# ========================
cursor_shape     beam
cursor_blink_interval 0.25
cursor_trail 1

# ========================
# WINDOW APPEARANCE
# ========================
background_opacity 0.9
background_blur 1
dynamic_background_opacity yes

# Padding (jarak dalam terminal)
window_padding_width 5

# ========================
# COLORS (Dracula-style)
# ========================
#background #1e1e2e
foreground #cdd6f4
#
 background #0b0e14
# foreground #f38ba8  #foreground untuk tulisan

# Black
color0  #45475a
color8  #585b70

# Red
# color1  #f38ba8
# color9  #f38ba8
#
# # Green
# color2  #a6e3a1
# color10 #a6e3a1
#
# # Yellow
# color3  #f9e2af
# color11 #f9e2af
#
# # Blue
# color4  #89b4fa
# color12 #89b4fa
#
# # Magenta
# color5  #f5c2e7
# color13 #f5c2e7
#
# # Cyan
# color6  #94e2d5
# color14 #94e2d5
#
# # White
# color7  #bac2de
# color15 #a6adc8

# ========================
# SELECTION
# ========================
selection_background #f5e0dc
selection_foreground #1e1e2e

# ========================
# SCROLLBACK
# ========================
scrollback_lines 10000

# ========================
# TAB BAR``
# ========================
tab_bar_edge top
tab_bar_style powerline
active_tab_background   #89b4fa
active_tab_foreground   #1e1e2e
inactive_tab_background #313244
inactive_tab_foreground #cdd6f4

# ========================
# MOUSE
# ========================
hide_mouse_when_typing yes

# ========================
# BELL
# ========================
enable_audio_bell no
visual_bell_duration 0

# ========================
# PERFORMANCE
# ========================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# New tab
map ctrl+alt+t new_tab

# Tutup tab
map ctrl+alt+w close_tab

# Navigasi tab
map ctrl+alt+right next_tab   
map ctrl+alt+left previous_tab
#next_tab = ctr + tab
#previous_tab = ctrl + shift + tab
